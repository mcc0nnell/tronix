name: Native Celix runtime
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential cmake ninja-build pkg-config zip             uuid-dev zlib1g-dev libzip-dev libjansson-dev             libcurl4-openssl-dev libffi-dev libxml2-dev libuv1-dev libssl-dev

      - name: Fetch exactly pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/apache/celix.git "$RUNNER_TEMP/apache-celix"
          git -C "$RUNNER_TEMP/apache-celix" checkout --detach 270c784d20dabd0b1f6418c7ee2195822ec9ef90
          test "$(git -C "$RUNNER_TEMP/apache-celix" rev-parse HEAD)" = 270c784d20dabd0b1f6418c7ee2195822ec9ef90
          git clone --filter=blob:none https://github.com/msgpack/msgpack-c.git "$RUNNER_TEMP/msgpack-c"
          git -C "$RUNNER_TEMP/msgpack-c" checkout --detach e1b8bc889d0c16714fc9236af4b954cbfa182be4
          test "$(git -C "$RUNNER_TEMP/msgpack-c" rev-parse HEAD)" = e1b8bc889d0c16714fc9236af4b954cbfa182be4

      - name: Checkout pinned 6lowStick native 6lowBang source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mcc0nnell/6lowstick
          ref: 28a664c907d25934b92f3f91055ed8ba7f5b9d6a
          path: sixs
          persist-credentials: false

      - name: Verify native caption source pin
        run: test "$(git -C sixs rev-parse HEAD)" = 28a664c907d25934b92f3f91055ed8ba7f5b9d6a

      - name: Configure native Celix bundles and daemon
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release             -DCELIX_SOURCE="$RUNNER_TEMP/apache-celix"             -DMSGPACK_SOURCE="$RUNNER_TEMP/msgpack-c"             -DTRONIX_BANG_SOURCE="$GITHUB_WORKSPACE/sixs/native/bang"

      - name: Build native runtime and fixture bundles
        run: cmake --build build --target tronixd tronix_worker tronix_scheduler_bundle tronix_demo_bundle tronix_bang_stream_bundle tronix_bang_udp_bundle bang-udp-celix-node -j 3

      - name: Install pinned MessagePack client
        run: npm ci --ignore-scripts

      - name: Run native-backed regression suite
        run: npm test

      - name: Run real C/Celix two-process signed binary UDP transport
        run: npm run test:bang:udp

      - name: Verify license metadata
        run: npm run license:check
