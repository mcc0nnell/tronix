name: 6lowBang fixture
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tronix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout pinned public 6lowStick C source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mcc0nnell/6lowstick
          ref: 28a664c907d25934b92f3f91055ed8ba7f5b9d6a
          path: sixs
          persist-credentials: false
      - name: Build standalone C fixture
        run: |
          cc -std=c11 -O1 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude -Isixs/native/bang/include \
            src/bang_fixture.c tests/bang-fixture.c \
            sixs/native/bang/src/lowbang.c -lcrypto \
            -o /tmp/tronix-bang-fixture
          /tmp/tronix-bang-fixture
      - name: Native signed caption stream, subscribers and backpressure
        run: |
          cc -std=c11 -O1 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude -Isixs/native/bang/include \
            src/bang_stream.c tests/bang-stream.c \
            sixs/native/bang/src/lowbang.c -pthread -lcrypto \
            -o /tmp/tronix-bang-stream
          /tmp/tronix-bang-stream
      - name: Check bounded C packet codec and authenticated subscriber delivery
        run: |
          cc -std=c11 -D_POSIX_C_SOURCE=200809L -O1 -Wall -Wextra -Wpedantic -Werror \
            -Iinclude -Isixs/native/bang/include \
            src/bang_wire.c src/bang_stream.c src/bang_thread_codec.c \
            sixs/native/bang/src/lowbang.c -pthread -lcrypto \
            -o /tmp/tronix-bang-thread-codec
          /tmp/tronix-bang-thread-codec selftest
          emitted="$(/tmp/tronix-bang-thread-codec emit)"
          frame1="$(printf '%s\n' "$emitted" | sed -n 's/^FRAME1=//p')"
          frame2="$(printf '%s\n' "$emitted" | sed -n 's/^FRAME2=//p')"
          test -n "$frame1" && test -n "$frame2"
          /tmp/tronix-bang-thread-codec verify-gap "$frame2"
          /tmp/tronix-bang-thread-codec verify "$frame2" "$frame1"
      - name: Verify project licensing
        run: npm run license:check
